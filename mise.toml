# Toolchain and task runner. `mise tasks` to list, `mise run <task>` to run.

[tools]
go = "1.27.0"
golangci-lint = "2.13.1"

[vars]
ldflags = "-X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)"

[tasks."build"]
description = "Build the work binary into the repository root"
run = 'go build -ldflags "{{vars.ldflags}}" -o work ./cmd/work'

[tasks."install"]
description = "Install work into the Go bin directory, where the shell finds it on PATH"
run = 'go install -ldflags "{{vars.ldflags}}" ./cmd/work'

[tasks."uninstall"]
description = "Remove the work binary that install put in the Go bin directory"
run = '''
bin="$(go env GOBIN)"
[ -n "$bin" ] || bin="$(go env GOPATH)/bin"
rm -v -f "$bin/work"
'''

[tasks."test"]
description = "Run the test suite"
run = "go test ./..."

[tasks."lint"]
description = "Vet and lint the packages"
run = ["go vet ./...", "golangci-lint run"]

[tasks."cover"]
description = "Report the coverage the suite reaches over the packages the binary ships"
run = '''
pkgs="$(go list -deps ./cmd/work | grep "^$(go list -m)/" | paste -sd,)"
go test -coverpkg="$pkgs" -coverprofile=coverage.out ./...
go tool cover -func=coverage.out | tail -n 1
'''
